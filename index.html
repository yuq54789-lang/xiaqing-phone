<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>我的小手机</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小手机">
<style>
:root {
  --bg:#f6f5f2; --card:#ffffff; --ink:#23211e; --sub:#8a857c; --line:#e6e2da;
  --accent:#c4572a; --accent-ink:#ffffff; --me:#f3d9cb; --them:#ffffff; --err:#b3261e; --ok:#2e7d4f;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#151412; --card:#211f1c; --ink:#ece8e1; --sub:#9a948a; --line:#34312c;
          --accent:#e8815a; --accent-ink:#1a0f0a; --me:#5a3426; --them:#2a2825; --err:#f2a39d; --ok:#7fd1a0; --shadow:none; }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif; overscroll-behavior:none; }
button,input,textarea,select { font:inherit; color:inherit; }
button { cursor:pointer; }
#app { position:fixed; inset:0; max-width:720px; margin:0 auto; background:var(--bg); overflow:hidden; }
.screen { position:absolute; inset:0; display:none; flex-direction:column; background:var(--bg); will-change:transform; }
.screen.active, .screen.leaving { display:flex; }
/* 页面切换：前进＝新页从右滑入、旧页微微左移；返回＝当前页向右滑出 */
.screen.in-fwd { z-index:2; animation:inFwd .3s cubic-bezier(.22,.8,.3,1) both; box-shadow:-10px 0 30px rgba(0,0,0,.12); }
.screen.out-fwd { z-index:1; animation:outFwd .3s cubic-bezier(.22,.8,.3,1) both; }
.screen.in-back { z-index:1; animation:inBack .3s cubic-bezier(.22,.8,.3,1) both; }
.screen.out-back { z-index:2; animation:outBack .3s cubic-bezier(.22,.8,.3,1) both; box-shadow:-10px 0 30px rgba(0,0,0,.12); }
@keyframes inFwd { from { transform:translateX(100%); } to { transform:none; } }
@keyframes outFwd { from { transform:none; opacity:1; } to { transform:translateX(-22%); opacity:.55; } }
@keyframes inBack { from { transform:translateX(-22%); opacity:.55; } to { transform:none; opacity:1; } }
@keyframes outBack { from { transform:none; } to { transform:translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .screen { animation:none !important; } }
.mdl-list { max-height:46vh; overflow:auto; border:1px solid var(--line); border-radius:10px; margin:8px 0; }
.mdl-list button { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:none; padding:11px 12px; font-size:14px; word-break:break-all; }
.mdl-list button:last-child { border-bottom:0; }
.mdl-list button.on { color:var(--accent); font-weight:600; }
.mdl-list .empty { padding:16px; text-align:center; color:var(--sub); font-size:13px; }
.sel-btn { width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center; gap:8px; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:10px; word-break:break-all; }
.sel-btn::after { content:"▾"; color:var(--sub); flex:none; }
.bar { display:flex; align-items:center; gap:8px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px; border-bottom:1px solid var(--line); background:var(--bg); flex:none; }
.bar h1,.bar h2 { margin:0; font-size:17px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar h1 { font-size:20px; letter-spacing:.5px; }
.icon { border:0; background:none; font-size:22px; width:36px; height:36px; border-radius:18px; line-height:1; color:var(--ink); }
.icon:active { background:var(--line); }
.txt-btn { border:0; background:none; color:var(--accent); font-size:15px; padding:6px 8px; }
.scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.pad { padding:12px 14px calc(24px + env(safe-area-inset-bottom)); }

/* 角色列表 */
.char { display:flex; gap:12px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); }
.char:active { background:var(--line); }
.avatar { width:46px; height:46px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:18px; flex:none; overflow:hidden; }
.avatar img { width:100%; height:100%; object-fit:cover; }
.char .meta { flex:1; min-width:0; }
.char .name { font-weight:600; }
.char .last { color:var(--sub); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.char .time { color:var(--sub); font-size:12px; align-self:flex-start; margin-top:4px; }
.tabs { display:flex; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); flex:none; }
.tabs button { flex:1; border:0; background:none; padding:13px 0; color:var(--ink); font-size:14px; }
.tabs button:active { background:var(--line); }
.empty { color:var(--sub); text-align:center; padding:60px 24px; line-height:1.9; }

/* 聊天 */
#msgs { padding:10px 12px 16px; display:flex; flex-direction:column; gap:6px; }
.row { display:flex; gap:8px; align-items:flex-end; max-width:100%; }
.row.me { flex-direction:row-reverse; }
.row .avatar { width:34px; height:34px; font-size:14px; }
.bubble { max-width:76%; padding:8px 12px; border-radius:16px; background:var(--them); box-shadow:var(--shadow); white-space:pre-wrap; word-break:break-word; border:1px solid var(--line); }
.row.me .bubble { background:var(--me); border-color:transparent; }
.bubble.sticker { padding:4px; background:transparent; border-color:transparent; box-shadow:none; }
.bubble.sticker img { max-width:140px; max-height:140px; border-radius:10px; display:block; }
.bubble.sticker .alt { color:var(--sub); font-size:13px; padding:6px 8px; }
.bubble.transfer { background:#e9a23b; color:#2b1b00; border:0; min-width:170px; }
.bubble.transfer b { font-size:18px; display:block; }
.bubble.offline { max-width:92%; font-size:14.5px; line-height:1.85; letter-spacing:.2px; }
#fab button.on { background:color-mix(in srgb, var(--accent) 55%, transparent); color:#fff; }
.bubble .quote { font-size:12px; color:var(--sub); border-left:3px solid var(--line); padding:1px 0 1px 8px; margin-bottom:5px; max-height:3.2em; overflow:hidden; }
.bubble.voice::before { content:"🎤 "; }
.sysline { align-self:center; color:var(--sub); font-size:12px; padding:2px 10px; text-align:center; }
.sysline.err { color:var(--err); background:color-mix(in srgb, var(--err) 10%, transparent); border-radius:10px; padding:8px 12px; font-size:13px; text-align:left; white-space:pre-wrap; word-break:break-all; max-width:92%; }
.sysline.err button { display:block; margin-top:6px; }
.more { align-self:center; border:1px solid var(--line); background:var(--card); border-radius:14px; padding:4px 14px; color:var(--sub); font-size:13px; }
.typing .bubble { color:var(--sub); }
.dots::after { content:"…"; animation:blink 1.1s infinite; }
@keyframes blink { 50% { opacity:.2; } }
#composer { display:flex; gap:8px; align-items:flex-end; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--bg); flex:none; }
#input { flex:1; resize:none; max-height:120px; border:1px solid var(--line); background:var(--card); border-radius:18px; padding:8px 14px; outline:none; }
#input:focus { border-color:var(--accent); }
.pill { border:0; border-radius:18px; padding:9px 14px; background:var(--accent); color:var(--accent-ink); font-weight:600; flex:none; }
.pill.ghost { padding:9px 12px; background:var(--card); color:var(--ink); border:1px solid var(--line); font-weight:400; }
.pill:disabled { opacity:.45; }

/* 表单 */
.group { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:16px; overflow:hidden; }
.group-title { font-size:12px; color:var(--sub); padding:0 6px 6px; text-transform:none; letter-spacing:.3px; }
.field { display:flex; flex-direction:column; gap:4px; padding:10px 12px; border-bottom:1px solid var(--line); }
.field:last-child { border-bottom:0; }
.field.inline { flex-direction:row; align-items:center; justify-content:space-between; }
.field label { font-size:13px; color:var(--sub); }
.field label .val, .field .val { float:right; color:var(--ink); font-weight:600; }
.field.inline label { font-size:15px; color:var(--ink); }
.field input[type=text],.field input[type=password],.field input[type=number],.field select,.field textarea { width:100%; border:0; background:transparent; outline:none; padding:2px 0; }
.field textarea { resize:vertical; min-height:90px; line-height:1.5; }
.field .hint { font-size:12px; color:var(--sub); }
.switch { position:relative; width:46px; height:28px; flex:none; }
.switch input { opacity:0; width:100%; height:100%; margin:0; position:absolute; inset:0; z-index:1; }
.switch i { position:absolute; inset:0; border-radius:14px; background:var(--line); transition:.15s; }
.switch i::after { content:""; position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.3); }
.switch input:checked + i { background:var(--accent); }
.switch input:checked + i::after { transform:translateX(18px); }
.btn { border:1px solid var(--line); background:var(--card); border-radius:10px; padding:9px 14px; }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.danger { color:var(--err); }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 14px; }

/* 列表项 */
.item { padding:11px 12px; border-bottom:1px solid var(--line); }
.item:last-child { border-bottom:0; }
.item:active { background:var(--line); }
.item .t { display:flex; gap:8px; align-items:center; }
.item .t b { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .c { color:var(--sub); font-size:13px; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; }
.badge { font-size:11px; padding:1px 7px; border-radius:9px; background:var(--line); color:var(--sub); flex:none; }
.badge.on { background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok); }
.badge.acc { background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }
.check { display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); }
.check:last-child { border-bottom:0; }

/* 弹层 */
#sheet { position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.4); }
#sheet[hidden] { display:none; }
#sheet .panel { width:100%; max-width:720px; max-height:88%; overflow:auto; background:var(--card); border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
#sheet h3 { margin:0 0 10px; font-size:16px; }
#sheet pre { white-space:pre-wrap; word-break:break-all; font-size:12px; background:var(--bg); padding:10px; border-radius:8px; max-height:52vh; overflow:auto; margin:0 0 10px; }
#sheet textarea { width:100%; min-height:200px; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:10px; outline:none; }
#sheet .menu-btn { display:block; width:100%; text-align:left; border:0; background:none; padding:13px 4px; border-bottom:1px solid var(--line); font-size:16px; }
#sheet .menu-btn:last-child { border-bottom:0; }
#toast { position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#222; color:#fff; padding:9px 16px; border-radius:20px; font-size:14px; z-index:99; opacity:0; pointer-events:none; transition:opacity .2s; max-width:86%; text-align:center; }
#toast.show { opacity:.94; }
.th-card { border-left:3px solid var(--accent); background:var(--card); border-radius:0 14px 14px 0; padding:14px 16px; margin-bottom:18px; box-shadow:var(--shadow); }
.th-cap { font-size:12px; color:var(--sub); margin-bottom:6px; }
.th-voice { font-size:19px; line-height:1.55; font-weight:500; margin-bottom:10px; }
.th-jot { font-size:14px; line-height:1.8; color:var(--sub); white-space:pre-wrap; }
/* 聊天页右上角：悬浮圆形磨砂按钮 */
#fab { position:absolute; inset:0; z-index:40; }
#fab[hidden] { display:none; }
#fab .stack { position:absolute; right:12px; top:calc(56px + env(safe-area-inset-top)); display:flex; flex-direction:column; gap:12px; align-items:center; }
#fab button { width:46px; height:46px; border-radius:50%; border:1px solid rgba(255,255,255,.55); padding:0; display:flex; align-items:center; justify-content:center; color:var(--ink);
  background:color-mix(in srgb, var(--card) 52%, transparent); backdrop-filter:blur(14px) saturate(1.5); -webkit-backdrop-filter:blur(14px) saturate(1.5);
  box-shadow:0 6px 18px rgba(0,0,0,.2); animation:fabpop .24s cubic-bezier(.2,.9,.3,1.2) both; }
#fab button:active { transform:scale(.92); }
#fab svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
@keyframes fabpop { from { opacity:0; transform:translateY(-10px) scale(.5); } to { opacity:1; transform:none; } }
/* 美化页：悬浮磨砂卡片 */
#s-beauty { background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 22%, var(--bg)), var(--bg) 55%, color-mix(in srgb, var(--accent) 12%, var(--bg))); }
.glass { background:color-mix(in srgb, var(--card) 62%, transparent); backdrop-filter:blur(18px) saturate(1.5); -webkit-backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid color-mix(in srgb, #fff 45%, transparent); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.10); padding:12px; margin-bottom:14px; }
.glass h4 { margin:0 0 8px; font-size:13px; color:var(--sub); font-weight:500; letter-spacing:.3px; }
.bt-prev { display:flex; flex-direction:column; gap:8px; }
.bt-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.bt-card { border:2px solid transparent; border-radius:10px; padding:8px; background:color-mix(in srgb, var(--card) 70%, transparent); text-align:left; }
.bt-card.on { border-color:var(--accent); }
.bt-card .sw { display:flex; gap:4px; margin-bottom:6px; }
.bt-card .sw i { flex:1; height:22px; border-radius:6px; border:1px solid rgba(0,0,0,.08); }
.bt-card b { font-size:13px; font-weight:600; }
#beauty-css { width:100%; min-height:150px; border:1px solid var(--line); border-radius:8px; background:color-mix(in srgb, var(--bg) 70%, transparent); padding:10px; font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace; resize:vertical; }
.bt-hint { font-size:12px; color:var(--sub); margin-top:6px; white-space:pre-line; }
/* 气泡逐条弹出 / 长按选择 / 引用 */
.row.pop .bubble, .row.pop > .avatar { animation:bpop .26s cubic-bezier(.2,.9,.3,1.25) both; transform-origin:0 100%; }
.row.me.pop .bubble { transform-origin:100% 100%; }
@keyframes bpop { from { opacity:0; transform:scale(.7) translateY(8px); } to { opacity:1; transform:none; } }
.bubble { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
.selecting .row[data-id] { cursor:pointer; }
.selecting .row[data-id]::before { content:""; flex:none; width:18px; height:18px; border-radius:50%; border:2px solid var(--sub); align-self:center; }
.selecting .row.me[data-id]::before { order:3; }
.selecting .row.sel::before { background:var(--accent); border-color:var(--accent); box-shadow:inset 0 0 0 3px var(--card); }
#quote-bar { display:flex; align-items:center; gap:8px; padding:6px 12px; font-size:12.5px; color:var(--sub); border-top:1px solid var(--line); background:var(--card); }
#quote-bar[hidden], #selbar[hidden], #composer[hidden] { display:none; }
#quote-bar span { flex:1; border-left:3px solid var(--accent); padding-left:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#quote-bar button { border:0; background:none; color:var(--sub); font-size:16px; padding:2px 6px; }
#selbar { display:flex; align-items:center; gap:8px; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--card); }
#selbar span { flex:1; font-size:14px; }
/* 居中报错弹窗 */
#errpop { position:fixed; inset:0; z-index:120; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.28); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
#errpop[hidden] { display:none; }
#errpop .card { width:min(300px,82vw); max-height:70vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 14px; border-radius:20px; text-align:center;
  background:color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter:blur(24px) saturate(1.6); -webkit-backdrop-filter:blur(24px) saturate(1.6); box-shadow:0 14px 40px rgba(0,0,0,.35); animation:epop .22s cubic-bezier(.2,.9,.3,1.2); }
@keyframes epop { from { opacity:0; transform:scale(.85); } to { opacity:1; transform:none; } }
#errpop .e-icon { width:38px; height:38px; border-radius:50%; background:var(--err); color:#fff; font-weight:700; font-size:22px; line-height:38px; margin-bottom:8px; }
#errpop .e-title { font-weight:600; font-size:16px; margin-bottom:6px; word-break:break-word; }
#errpop .e-body { margin:0 0 12px; width:100%; overflow:auto; text-align:left; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; word-break:break-all; color:var(--sub); user-select:text; -webkit-user-select:text; }
#errpop .e-btns { display:flex; gap:8px; width:100%; }
#errpop .e-btns button { flex:1; border:0; border-radius:12px; padding:10px 0; font-size:15px; background:color-mix(in srgb, var(--ink) 9%, transparent); color:var(--ink); }
#errpop .e-btns #errpop-close { background:var(--accent); color:#fff; }
/* 对方正在输入：名字位置闪动 */
.typing-title { animation:tflash 1.3s ease-in-out infinite; }
.typing-title i { font-style:normal; display:inline-block; animation:tdot 1.2s infinite both; }
.typing-title i:nth-child(2) { animation-delay:.2s; } .typing-title i:nth-child(3) { animation-delay:.4s; }
@keyframes tflash { 0%,100% { opacity:1; } 50% { opacity:.4; } }
@keyframes tdot { 0%,80%,100% { opacity:.15; } 40% { opacity:1; } }
.field input[type=range] { width:100%; accent-color:var(--accent); margin:6px 0 2px; }
.stk-tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; padding-bottom:2px; }
.stk-tabs button { flex:none; border:1px solid var(--line); background:var(--bg); border-radius:14px; padding:3px 12px; font-size:13px; }
.stk-tabs button.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.stk-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-height:46vh; overflow-y:auto; margin-bottom:10px; }
.stk-grid .stk { aspect-ratio:1; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:11px; color:var(--sub); text-align:center; padding:2px; }
.stk-grid .stk img { width:100%; height:100%; object-fit:cover; }
.av-pick { display:flex; align-items:center; gap:12px; padding:10px 12px; border-bottom:1px solid var(--line); }
.av-pick .avatar { width:52px; height:52px; }
/* 桌面 */
#s-home { background:radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--accent) 14%, var(--bg)) 0%, var(--bg) 70%); }
.home { padding:calc(36px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom)); }
.home-clock { text-align:center; margin-bottom:22px; }
.home-clock .big { font-size:64px; font-weight:200; letter-spacing:2px; line-height:1.1; font-variant-numeric:tabular-nums; }
.home-clock .date { color:var(--sub); font-size:14px; margin-top:4px; }
#home-widget { margin-bottom:26px; }
.widget { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px; box-shadow:var(--shadow); }
.widget:active { transform:scale(.99); }
.widget .meta { flex:1; min-width:0; }
.widget .cap { font-size:11px; color:var(--sub); letter-spacing:.5px; }
.widget .name { font-weight:600; }
.widget .last { color:var(--sub); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.app-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:22px 8px; }
.app { display:flex; flex-direction:column; align-items:center; gap:7px; background:none; border:0; padding:0; }
.app .tile { width:62px; height:62px; border-radius:18px; display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.14); }
.app:active .tile { transform:scale(.93); }
.app .tile svg { width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.app span { font-size:12px; }
</style>
</head>
<body>
<div id="app">

  <section class="screen active" id="s-home">
    <div class="scroll home">
      <div class="home-clock"><div class="big" id="home-time"></div><div class="date" id="home-date"></div></div>
      <div id="home-widget"></div>
      <div class="app-grid" id="app-grid"></div>
    </div>
  </section>

  <section class="screen" id="s-list">
    <header class="bar"><button class="icon" data-back aria-label="返回">‹</button><h1>聊天</h1><button class="icon" id="b-newchar" aria-label="新建角色">＋</button></header>
    <div id="char-list" class="scroll"></div>
  </section>

  <section class="screen" id="s-chat">
    <header class="bar">
      <button class="icon" data-back aria-label="返回">‹</button>
      <h2 id="chat-title"></h2>
      <button class="icon" id="b-chatmenu" aria-label="菜单">⋯</button>
    </header>
    <div id="msgs" class="scroll"></div>
    <div id="quote-bar" hidden><span id="quote-text"></span><button type="button" id="quote-x" aria-label="取消引用">✕</button></div>
    <div id="selbar" hidden><span id="sel-n">已选 0 条</span><button type="button" class="pill ghost" id="sel-edit">编辑</button><button type="button" class="pill ghost" id="sel-copy">复制</button><button type="button" class="pill ghost" id="sel-del">删除</button><button type="button" class="pill" id="sel-cancel">取消</button></div>
    <form id="composer" autocomplete="off">

      <button type="button" class="pill ghost" id="b-wait">等回复</button>
      <button type="submit" class="pill" id="b-send">发送</button>
    </form>
  </section>

  <section class="screen" id="s-beauty">
    <header class="bar"><button class="icon" data-back>‹</button><h2>美化</h2></header>
    <div class="scroll"><div class="pad" id="beauty-body"></div></div>
  </section>

  <div id="errpop" hidden><div class="card" role="alertdialog"><div class="e-icon">!</div><div class="e-title" id="errpop-title"></div><pre class="e-body" id="errpop-body"></pre><div class="e-btns"><button type="button" id="errpop-retry">重试</button><button type="button" id="errpop-copy">复制</button><button type="button" id="errpop-close">好</button></div></div></div>

  <div id="fab" hidden><div class="stack" id="fab-stack"></div></div>

  <section class="screen" id="s-settings">
    <header class="bar"><button class="icon" data-back>‹</button><h2>设置</h2><button class="txt-btn" id="b-set-save">保存</button></header>
    <div class="scroll"><div class="pad" id="settings-body"></div></div>
  </section>

  <section class="screen" id="s-char">
    <header class="bar"><button class="icon" data-back>‹</button><h2>角色设置</h2><button class="txt-btn" id="b-char-save">保存</button></header>
    <div class="scroll"><div class="pad" id="char-body"></div></div>
  </section>

  <section class="screen" id="s-memory">
    <header class="bar">
      <button class="icon" data-back>‹</button><h2 id="mem-title">记忆</h2>
      <button class="txt-btn" id="b-mem-sum">总结</button>
      <button class="txt-btn" id="b-mem-refine">精炼</button>
      <button class="txt-btn" id="b-mem-add">＋</button>
    </header>
    <div class="scroll"><div class="pad" id="mem-body"></div></div>
  </section>

  <section class="screen" id="s-thoughts">
    <header class="bar"><button class="icon" data-back>‹</button><h2 id="th-title">心声</h2><button class="txt-btn" id="b-th-gen">生成</button></header>
    <div class="scroll"><div class="pad" id="th-body"></div></div>
  </section>

  <section class="screen" id="s-wblist">
    <header class="bar"><button class="icon" data-back>‹</button><h2>世界书</h2><button class="txt-btn" id="b-wb-add">＋ 新建</button></header>
    <div class="scroll"><div class="pad" id="wblist-body"></div></div>
  </section>

  <section class="screen" id="s-wbedit">
    <header class="bar"><button class="icon" data-back>‹</button><h2 id="wbedit-title">编辑世界书</h2><button class="txt-btn" id="b-wb-save">保存</button></header>
    <div class="scroll"><div class="pad" id="wbedit-body"></div></div>
  </section>
</div>
<input type="file" id="file-import" accept=".json,application/json" hidden>

<div id="sheet" hidden><div class="panel" id="sheet-panel"></div></div>
<div id="toast"></div>
<script>
/* =====================================================================
 * 我的小手机 —— 单文件版
 * 结构：① 数据库  ② 提示词拼接  ③ 调用模型（含流式）  ④ 记忆  ⑤ 界面
 * 数据格式见 myphone-format-v1.md
 * ===================================================================== */

/* ---------- ① 数据库（原生 IndexedDB，无需外部库） ---------- */
var DB_NAME = 'myphone', DB_VER = 1, db = null;
var STORES = {
  characters: { keyPath: 'id' },
  messages: { keyPath: 'id', index: [['byChar', ['characterId', 'ts', 'id']]] },
  memories: { keyPath: 'id', index: [['byChar', 'characterId']] },
  thoughts: { autoIncrement: true },
  worldBooks: { keyPath: 'id' },
  worldBookCategories: { keyPath: 'id' },
  userPersonas: { keyPath: 'id' },
  stickers: { keyPath: 'id' },
  stickerCategories: { keyPath: 'id' },
  settings: { keyPath: 'key' }
};

function openDB() {
  return new Promise(function (res, rej) {
    var req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = function () {
      var d = req.result;
      Object.keys(STORES).forEach(function (name) {
        var def = STORES[name];
        var os = d.createObjectStore(name, def.keyPath ? { keyPath: def.keyPath } : { autoIncrement: true });
        (def.index || []).forEach(function (ix) { os.createIndex(ix[0], ix[1]); });
      });
    };
    req.onsuccess = function () { db = req.result; res(db); };
    req.onerror = function () { rej(req.error); };
  });
}
function reqP(r) { return new Promise(function (res, rej) { r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
function dbGet(store, key) { return reqP(db.transaction(store).objectStore(store).get(key)); }
function dbAll(store) { return reqP(db.transaction(store).objectStore(store).getAll()); }
function dbPut(store, val) { return reqP(db.transaction(store, 'readwrite').objectStore(store).put(val)); }
function dbDel(store, key) { return reqP(db.transaction(store, 'readwrite').objectStore(store).delete(key)); }
function dbClear(store) { return reqP(db.transaction(store, 'readwrite').objectStore(store).clear()); }
function dbBulkPut(store, arr) {
  return new Promise(function (res, rej) {
    if (!arr || !arr.length) return res();
    var tx = db.transaction(store, 'readwrite'), os = tx.objectStore(store);
    for (var i = 0; i < arr.length; i++) os.put(arr[i]);
    tx.oncomplete = res; tx.onerror = function () { rej(tx.error); }; tx.onabort = function () { rej(tx.error); };
  });
}
function dbAllWithKeys(store) {
  return new Promise(function (res, rej) {
    var out = [], cur = db.transaction(store).objectStore(store).openCursor();
    cur.onsuccess = function () { var c = cur.result; if (c) { out.push({ key: c.primaryKey, value: c.value }); c.continue(); } else res(out); };
    cur.onerror = function () { rej(cur.error); };
  });
}
function dbByIndex(store, index, key) { return reqP(db.transaction(store).objectStore(store).index(index).getAll(key)); }

/* 取某角色的一页消息（从新到旧，返回时已按时间正序）。before = {ts,id} 表示取比它更早的 */
function pageMessages(cid, before, limit) {
  return new Promise(function (res, rej) {
    var idx = db.transaction('messages').objectStore('messages').index('byChar');
    var upper = before ? [cid, before.ts, before.id] : [cid, Infinity, '￿'];
    var range = IDBKeyRange.bound([cid, -Infinity, ''], upper, false, !!before);
    var out = [], cur = idx.openCursor(range, 'prev');
    cur.onsuccess = function () {
      var c = cur.result;
      if (c && out.length < limit) { out.push(c.value); c.continue(); }
      else res(out.reverse());
    };
    cur.onerror = function () { rej(cur.error); };
  });
}
function countMessagesAfter(cid, ts) {
  return new Promise(function (res, rej) {
    var idx = db.transaction('messages').objectStore('messages').index('byChar');
    var r = reqP(idx.count(IDBKeyRange.bound([cid, ts, '￿'], [cid, Infinity, '￿'], true, false)));
    r.then(res, rej);
  });
}

/* ---------- 设置 ---------- */
/* 系统提示词里的「回复要求」：内置在代码里，不在界面上显示 */
var OUTPUT_RULES = '像真人在手机上聊天一样回复：口语化，简短自然。\n把回复拆成几条短消息，每条消息单独一行（最多 6 条）。\n不要在开头写你的名字，不要写旁白、括号动作或解释，除非角色设定要求这样。\n始终保持角色设定，不要承认自己是 AI。';
/* 线下模式：面对面的小说式叙述，不拆气泡、不发表情包 */
var OFFLINE_RULES = '现在是线下场景，你和用户面对面相处，不再是手机聊天。\n用小说式的叙述回复：用第三人称写角色的动作、神态、环境，对白用「」括起来，连贯地写成一段或几段文字。\n篇幅 200 到 600 字，一次写完，不要拆成多条消息，不要发表情包，不要用你的名字做开头。\n只写角色自己的言行和感受，不要替用户说话、替用户做动作。\n始终保持角色设定，不要承认自己是 AI。';
var DEFAULTS = {
  baseUrl: '', apiKey: '', model: '', temperature: 0.8,
  stream: false, themeId: 'default', customCss: '',
  secBaseUrl: '', secApiKey: '', secModel: '',
  scanDepth: 5, worldBookMaxChars: 6000, memoryLimit: 20, defaultContext: 30, stickerPromptLimit: 60, autoReply: false, apiPresets: [], activePresetId: null
};
var settings = Object.assign({}, DEFAULTS);
async function loadSettings() {
  var row = await dbGet('settings', 'app');
  settings = Object.assign({}, DEFAULTS, row ? row.value : {});
}
function saveSettings() { return dbPut('settings', { key: 'app', value: settings }); }

/* ---------- ② 提示词拼接 ---------- */
function uid(prefix) { return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* 世界书：扫描最近的文字，命中关键词的条目才放进提示词；没有关键词的条目=常驻 */
function triggeredEntries(books, texts, maxChars) {
  var hay = texts.join('\n').toLowerCase(), out = [], total = 0;
  books.forEach(function (b) {
    (b.entries || []).forEach(function (e) {
      if (e.enabled === false || !e.content) return;
      var keys = (e.keys || []).filter(Boolean);
      var hit = keys.length === 0 || keys.some(function (k) { return hay.indexOf(String(k).toLowerCase()) !== -1; });
      if (!hit) return;
      if (total + e.content.length > maxChars) return;
      total += e.content.length;
      out.push({ book: b.name, title: e.title, content: e.content, always: keys.length === 0 });
    });
  });
  return out;
}

/* 记忆：最新一条精炼 + 它之后的自动总结 + 所有手动记忆，最多 limit 条 */
function pickMemories(mems, limit) {
  var refined = null;
  mems.forEach(function (m) { if (m.kind === 'refined' && (!refined || m.ts > refined.ts)) refined = m; });
  var rest = mems.filter(function (m) {
    if (m.kind === 'refined') return false;
    if (m.kind === 'note') return true;
    return !refined || m.ts > refined.ts;
  }).sort(function (a, b) { return a.ts - b.ts; });
  rest = rest.slice(-limit);
  return (refined ? [refined] : []).concat(rest);
}

function fmtTime(ts, tz) {
  try { return new Date(ts).toLocaleString('zh-CN', { hour12: false, timeZone: tz || undefined }); }
  catch (e) { return new Date(ts).toLocaleString('zh-CN', { hour12: false }); }
}

function buildSystem(ctx) {
  var c = ctx.char, s = ctx.settings, L = [];
  L.push('你正在扮演「' + (c.realName || c.name) + '」，' + (c.offlineMode ? '和用户面对面相处。' : '通过手机和用户聊天。'));
  if (c.persona) L.push('# 角色设定\n' + c.persona);
  var me = [];
  if (c.userNickname) me.push('你称呼用户为：' + c.userNickname);
  if (c.userPersona) me.push(c.userPersona);
  if (me.length) L.push('# 用户\n' + me.join('\n'));
  if (ctx.entries.length) {
    L.push('# 世界书（当前相关的设定）\n' + ctx.entries.map(function (e) {
      return '【' + (e.title || e.book) + '】\n' + e.content;
    }).join('\n\n'));
  }
  if (ctx.memories.length) {
    L.push('# 长期记忆（你们之前发生的事，按时间从早到晚）\n' + ctx.memories.map(function (m) { return '- ' + m.content; }).join('\n'));
  }
  if (!c.offlineMode && ctx.stickers && ctx.stickers.length) {
    L.push('# 可发送的表情包\n想发表情包时，单独占一行，写成 [表情包：名称]，名称必须从下面选一个，不要自己编：\n' +
      ctx.stickers.map(function (st) { return st.name; }).join('、'));
  }
  if (ctx.thought) {
    L.push('# 你此刻的内心（只有你自己知道，不要直接念出来，但要让言行和它保持一致）\n心声：' + ctx.thought.heartfeltVoice + (ctx.thought.randomJottings ? '\n散记：' + ctx.thought.randomJottings : ''));
  }
  L.push('# 当前时间\n' + fmtTime(ctx.now, c.timeZone));
  L.push('# 回复要求\n' + (c.offlineMode ? OFFLINE_RULES : OUTPUT_RULES));
  return L.join('\n\n');
}

/* 表情包：从角色选中的分类里挑出可用的；太多时随机抽 limit 个，避免提示词过长 */
function stickerPool(stickers, categoryIds) {
  if (categoryIds == null) return stickers.slice();
  if (!categoryIds.length) return [];
  var set = {}; categoryIds.forEach(function (id) { set[String(id)] = true; });
  return stickers.filter(function (s) { return set[String(s.categoryId)]; });
}
function sampleStickers(pool, limit) {
  var a = pool.filter(function (s) { return s.name; }).slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a.slice(0, limit);
}
function findSticker(pool, name) {
  var n = String(name).trim();
  return pool.find(function (s) { return s.name === n; }) ||
    pool.find(function (s) { return s.name && (s.name.indexOf(n) !== -1 || n.indexOf(s.name) !== -1); }) || null;
}
/* 模型回复的每一行 -> 消息草稿（文字或表情包） */
function parseReplyLines(lines, pool) {
  var out = [];
  lines.forEach(function (ln) {
    var m = ln.match(/^[\[【]\s*表情包?\s*[:：]\s*(.+?)\s*[\]】]$/);
    if (m) {
      var st = findSticker(pool, m[1]);
      if (st) out.push({ type: 'sticker', content: st.url, meta: { meaning: st.name } });
      return; // 找不到对应表情包就丢掉这一行
    }
    out.push({ type: 'text', content: ln });
  });
  return out;
}

/* 一条历史消息 -> 给模型看的文字 */
function msgToText(m) {
  var t = m.type || 'text', meta = m.meta || {}, c = m.content || '';
  if (t === 'sticker') return '[表情包：' + (meta.meaning || '无描述') + ']';
  if (t === 'transfer') return '[转账 ' + (meta.amount != null ? '¥' + meta.amount : '') + (meta.note ? '，备注：' + meta.note : '') + ']';
  if (t === 'voice') return '[语音] ' + c;
  if (t === 'recalled') return '[撤回了一条消息]';
  if (t === 'pat' || t === 'system') return c.charAt(0) === '[' ? c : '[系统提示：' + c + ']';
  if (meta.quote && typeof meta.quote === 'object') {
    var q = meta.quote.content || meta.quote.text || '';
    if (q) return '（回复「' + String(q).slice(0, 60) + '」）' + c;
  }
  return c;
}

/* 历史 -> API 消息：system 当作 user 提示，连续同角色的合并成一条 */
function toApiMessages(history) {
  var out = [];
  history.forEach(function (m) {
    var role = m.role === 'assistant' ? 'assistant' : 'user';
    var text = msgToText(m);
    if (!text) return;
    var last = out[out.length - 1];
    if (last && last.role === role) last.content += '\n' + text;
    else out.push({ role: role, content: text });
  });
  return out;
}

/* 模型的回复 -> 多条气泡 */
function splitReply(text, max) {
  var lines = String(text || '').replace(/\r/g, '').split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
  if (lines.length > max) lines = lines.slice(0, max - 1).concat([lines.slice(max - 1).join('\n')]);
  return lines;
}

/* ---------- ③ 调用模型 ---------- */
function isGemini(base) { return /generativelanguage\.googleapis\.com/.test(base || ''); }
function openaiUrl(base) {
  var b = String(base || '').trim().replace(/\/+$/, '');
  return /\/v1$/.test(b) ? b + '/chat/completions' : b + '/v1/chat/completions';
}
function modelsUrl(base) {
  var b = String(base || '').trim().replace(/\/+$/, '');
  return /\/v1$/.test(b) ? b + '/models' : b + '/v1/models';
}

async function httpError(res) {
  var msg = '', raw = '';
  try { raw = await res.clone().text(); } catch (e0) {}
  try {
    var j = await res.json();
    msg = (j && j.error && (j.error.message || j.error)) || JSON.stringify(j);
  } catch (e) { try { msg = await res.text(); } catch (e2) {} }
  var er = new Error('API 返回错误: ' + res.status + ' ' + res.statusText + (msg ? ' - ' + String(msg).slice(0, 400) : ''));
  er.status = res.status; er.statusText = res.statusText; er.raw = raw;
  return er;
}

async function readSSE(res, onData) {
  var reader = res.body.getReader(), dec = new TextDecoder('utf-8'), buf = '';
  while (true) {
    var r = await reader.read();
    if (r.done) break;
    buf += dec.decode(r.value, { stream: true });
    var lines = buf.split(/\r?\n/); buf = lines.pop();
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i].trim();
      if (ln.indexOf('data:') !== 0) continue;
      var d = ln.slice(5).trim();
      if (!d) continue;
      if (d === '[DONE]') return;
      var o; try { o = JSON.parse(d); } catch (e) { continue; }
      onData(o);
    }
  }
  var tail = (buf + dec.decode()).trim();
  if (tail.indexOf('data:') === 0) { try { onData(JSON.parse(tail.slice(5))); } catch (e) {} }
}

/*
 * 统一调用入口。opts: {base,key,model,temperature,system,messages,stream,onDelta,signal}
 * 返回完整回复文字。流式时每收到一块就调用 onDelta(目前为止的全文)。
 */
async function callLLM(o) {
  var gem = isGemini(o.base), url, headers = { 'Content-Type': 'application/json' }, body;
  if (!o.base || !o.model) throw new Error('请先在「设置」里填写反代地址和模型');
  if (gem) {
    var root = String(o.base).trim().replace(/\/+$/, '').replace(/\/v1(beta)?(\/models)?$/, '');
    url = root + '/v1beta/models/' + encodeURIComponent(o.model) + (o.stream ? ':streamGenerateContent?alt=sse&' : ':generateContent?') + 'key=' + encodeURIComponent(o.key || '');
    var contents = o.messages.map(function (m) { return { role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }; });
    if (!contents.length || contents[0].role !== 'user') contents.unshift({ role: 'user', parts: [{ text: '（开始）' }] });
    body = { systemInstruction: { parts: [{ text: o.system }] }, contents: contents, generationConfig: { temperature: o.temperature } };
  } else {
    url = openaiUrl(o.base);
    headers.Authorization = 'Bearer ' + (o.key || '');
    body = { model: o.model, messages: [{ role: 'system', content: o.system }].concat(o.messages), temperature: o.temperature, stream: !!o.stream };
  }

  var res;
  try {
    res = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body), signal: o.signal });
  } catch (e) {
    if (e && e.name === 'AbortError') throw e;
    var ne = new Error('网络请求失败: ' + e.message); ne.title = '网络请求失败'; ne.raw = e.message; throw ne;
  }
  if (!res.ok) throw await httpError(res);

  var ct = res.headers.get('content-type') || '';
  var text = '';
  try {
    if (o.stream && res.body && ct.indexOf('text/event-stream') !== -1) {
      await readSSE(res, function (j) {
        var piece = '';
        if (gem) {
          var ps = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts;
          (ps || []).forEach(function (p) { if (typeof p.text === 'string' && !p.thought) piece += p.text; });
        } else {
          if (j.error) { var se = new Error('API 返回错误: ' + (j.error.message || JSON.stringify(j.error))); se.raw = JSON.stringify(j); throw se; }
          var ch = j.choices && j.choices[0];
          if (ch && ch.delta && typeof ch.delta.content === 'string') piece = ch.delta.content;
        }
        if (piece) { text += piece; if (o.onDelta) o.onDelta(text); }
      });
    } else {
      var j = await res.json();
      if (gem) {
        var ps2 = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts;
        text = (ps2 || []).filter(function (p) { return !p.thought; }).map(function (p) { return p.text || ''; }).join('');
      } else {
        text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
      }
      if (o.onDelta && text) o.onDelta(text);
    }
  } catch (e) {
    if (e && e.name === 'AbortError') throw e;

/* 组装提示词 */
async function buildPrompt(char) {
  var limit = char.contextLimit > 0 ? char.contextLimit : settings.defaultContext;
  var history = await pageMessages(char.id, null, limit);
  var apiMsgs = toApiMessages(history);
  var scan = history.slice(-settings.scanDepth).map(msgToText);
  var allBooks = await dbAll('worldBooks');
  var books = allBooks.filter(function (b) { return (char.worldBookIds || []).indexOf(b.id) !== -1; });
  var entries = triggeredEntries(books, scan, settings.worldBookMaxChars);
  var mems = pickMemories(await dbByIndex('memories', 'byChar', char.id), settings.memoryLimit);
  var thought = null;
  if (char.injectThought) {
    var th = (await dbAllWithKeys('thoughts')).map(function (r) { return r.value; }).filter(function (t) { return t.characterId === char.id; }).sort(function (a, b) { return b.ts - a.ts; })[0];
    if (th) thought = th;
  }
  var pool = stickerPool(await dbAll('stickers'), char.stickerCategoryIds);
  var shown = sampleStickers(pool, settings.stickerPromptLimit);
  var system = buildSystem({ char: char, settings: settings, entries: entries, memories: mems, stickers: shown, thought: thought, now: Date.now() });
  return { system: system, messages: apiMsgs, pool: pool, stats: { history: history.length, entries: entries.length, memories: mems.length, stickers: shown.length } };
}

/* 点「等回复」= 发一次请求。按钮永远可点：后台慢时可以再点一次，
 * 同一轮里谁先成功就用谁，后到的结果直接丢掉；全部失败才报错。 */
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function generateReply(fresh) {
  var char = cur, box = $('msgs'), r = rounds[char.id];
  if (fresh || !r || !r.active || r.won) r = rounds[char.id] = { active: true, won: false, total: 0, fails: 0 };
  r.total++; refreshTitle();
  try {
    var prompt = await buildPrompt(char); prompt.chatId = char.id;
    var text = await callLLM({
      base: settings.baseUrl, key: settings.apiKey, model: settings.model, temperature: Number(settings.temperature),
      system: prompt.system, messages: prompt.messages, stream: settings.stream
    });
    if (!r.active || r.won) return;
    var items = char.offlineMode ? (text.trim() ? [{ type: 'offline', content: text.trim() }] : []) : parseReplyLines(splitReply(text, 12), prompt.pool), base = Date.now(), saved = [];
    if (!items.length) throw new Error('模型的回复里没有可显示的内容（只有找不到的表情包）。原始回复：' + text.slice(0, 200));
    r.won = true;
    items.forEach(function (it, i) {
      var m = { id: uid(char.id), characterId: char.id, role: 'assistant', type: it.type, content: it.content, ts: base + i };
      if (it.meta) m.meta = it.meta; saved.push(m);
    });
    await dbBulkPut('messages', saved);
    /* 先存好，再一条一条弹出来；中途退出聊天也不丢 */
    for (var k = 0; k < saved.length; k++) {
      var m2 = saved[k];
      if (k > 0) await sleep(380 + Math.min(String(m2.content).length * 45, 900));
      if (cur && cur.id === char.id && !box.querySelector('.row[data-id="' + m2.id + '"]')) {
        var n = msgNode(m2); if (n) { n.classList.add('pop'); box.appendChild(n); } lastShownTs = m2.ts; scrollBottom();
      }
    }
    r.active = false;
    maybeAutoSummarize(char); maybeAutoThought(char);
  } catch (e) {
    r.fails++;
    showError(e);                                   /* 每个请求失败都弹，不等别的请求 */
    if (r.active && !r.won && r.fails >= r.total) r.active = false;   /* 全失败了，名字才恢复 */
  } finally { refreshTitle(); }
}

    var f = field('温度', r, '越低越稳定，越高越发散。常用 0.7–1.0。');
    f.firstChild.appendChild(v); return f;
  }
  var body = $('settings-body'); body.innerHTML = '';
  presetGroup().forEach(function (n) { body.appendChild(n); });
  function txt(key, label, type, ph, hint) {
    var i = h('input', { type: type || 'text', placeholder: ph || '', value: draft[key] == null ? '' : draft[key] });
    i.addEventListener('change', function () { draft[key] = type === 'number' ? Number(i.value) : i.value.trim(); markDirty(); });
    return field(label, i, hint);
  }
  function sw(key, label, hint) {
    var s = switchEl(draft[key], function (v) { draft[key] = v; markDirty(); });
    var row = h('div', { class: 'field inline' }, h('div', {}, h('label', { text: label }), hint ? h('div', { class: 'hint', text: hint }) : null), s.el);
    return row;
  }
  function modelField(label, mk, bk, kk, hint) {
    var b = h('button', { type: 'button', class: 'sel-btn', onclick: function () { pickModel(mk, bk, kk, function () { buildSettings(); }); } },
      h('span', { text: draft[mk] || '点击选择模型' }));
    if (!draft[mk]) b.firstChild.style.color = 'var(--sub)';
    return field(label, b, hint);
  }
  body.appendChild(h('div', { class: 'group-title', text: '主 API（对话）' }));
  body.appendChild(h('div', { class: 'group' },
    txt('baseUrl', '反代地址', 'text', 'https://api.openai.com', '填到域名即可，会自动补 /v1/chat/completions；填 Gemini 官方地址会自动用 Gemini 格式'),
    txt('apiKey', 'API Key', 'password', 'sk-...', '只保存在你这台设备的浏览器里'),
    modelField('模型', 'model', 'baseUrl', 'apiKey', '点一下选择；先在选择窗里「拉取」模型列表，也可以直接手动输入模型名。选好后记得点右上角「保存」。'), tempField()));

  body.appendChild(h('div', { class: 'group-title', text: '输出方式' }));
  body.appendChild(h('div', { class: 'group' },
    sw('stream', '流式输出', '长回复不容易被网关超时掐断。回复会收完再一起显示。'),
    sw('autoReply', '发送后自动回复', '关闭时，发送消息后角色不会立刻回，要你点聊天页的「等回复」才会回复。')));

  body.appendChild(h('div', { class: 'group-title', text: '副 API（总结、精炼记忆；留空则用主 API）' }));
  body.appendChild(h('div', { class: 'group' },
    txt('secBaseUrl', '反代地址', 'text', '留空使用主 API'), txt('secApiKey', 'API Key', 'password', '可选'), modelField('模型', 'secModel', 'secBaseUrl', 'secApiKey', '建议用便宜的小模型')));

  body.appendChild(h('div', { class: 'group-title', text: '上下文' }));
  body.appendChild(h('div', { class: 'group' },
    txt('defaultContext', '默认带最近多少条消息', 'number', '30', '角色设置里可以单独覆盖'),
    txt('memoryLimit', '最多带入多少条记忆', 'number', '20'),
    txt('scanDepth', '世界书扫描最近几条消息', 'number', '5'),
    txt('worldBookMaxChars', '世界书最多带入多少字', 'number', '6000'),
    txt('stickerPromptLimit', '提示词里最多列出多少个表情包', 'number', '60', '表情包很多时会随机抽取这么多告诉角色，避免提示词太长')));
}
onShow['s-settings'] = function () { draft = JSON.parse(JSON.stringify(settings)); settingsDirty = false; buildSettings(); };
$('b-set-save').onclick = async function () { await commitSettings(); toast('已保存'); };

/* ---------- 世界书 ---------- */
async function renderWbList() {
  var books = await dbAll('worldBooks'), body = $('wblist-body'); body.innerHTML = '';
  if (!books.length) { body.appendChild(h('div', { class: 'empty', text: '还没有世界书。点右上角新建。\n关键词留空的条目会一直带入；填了关键词的条目，聊天里出现关键词才带入。' })); body.firstChild.style.whiteSpace = 'pre-line'; return; }
  var g = h('div', { class: 'group' });
  books.forEach(function (b) {
    g.appendChild(h('div', { class: 'item', onclick: function () { editWb(b.id); } },
      h('div', { class: 't' }, h('b', { text: b.name || '未命名' }), h('span', { class: 'badge', text: (b.entries || []).length + ' 条' })),
      h('div', { class: 'c', text: (b.entries || []).map(function (e) { return e.title; }).filter(Boolean).join('、') })));
  });
  body.appendChild(g);
}
onShow['s-wblist'] = renderWbList;
$('b-wb-add').onclick = async function () {
  var b = { id: uid('wb'), name: '新世界书', categoryId: null, entries: [{ title: '', keys: [], content: '', enabled: true }] };
  await dbPut('worldBooks', b); editWb(b.id);
};
var wbEditing = null;
async function editWb(id) { wbEditing = await dbGet('worldBooks', id); go('s-wbedit'); }
onShow['s-wbedit'] = function () {
  if (!wbEditing) return;
  var b = wbEditing, body = $('wbedit-body'); body.innerHTML = '';
  var name = h('input', { type: 'text', value: b.name });
  body.appendChild(h('div', { class: 'group' }, field('世界书名称', name)));
  var holder = h('div', {}), rows = [];
  function addEntry(e) {
    var t = h('input', { type: 'text', value: e.title || '', placeholder: '条目标题' });
    var k = h('input', { type: 'text', value: (e.keys || []).join(','), placeholder: '关键词，用逗号分隔；留空 = 一直带入' });
    var c = h('textarea', {}); c.value = e.content || '';
    var en = switchEl(e.enabled !== false);
    var box = h('div', { class: 'group' }, field('标题', t), field('关键词', k), field('内容', c),
      h('div', { class: 'field inline' }, h('label', { text: '启用' }), en.el),
      h('div', { class: 'field' }, h('button', { class: 'btn danger', text: '删除此条目', onclick: function () { box.remove(); rows = rows.filter(function (r) { return r.box !== box; }); } })));
    rows.push({ box: box, t: t, k: k, c: c, en: en.input }); holder.appendChild(box);
  }
  (b.entries || []).forEach(addEntry);
  body.appendChild(holder);
  body.appendChild(h('div', { class: 'btn-row' }, h('button', { class: 'btn', text: '＋ 添加条目', onclick: function () { addEntry({ enabled: true }); } }),
    h('button', { class: 'btn danger', text: '删除这本世界书', onclick: function () {
      confirmSheet('删除「' + b.name + '」？', '删除', async function () { await dbDel('worldBooks', b.id); wbEditing = null; back(); }, true);
    } })));
  b._collect = function () {
    b.name = name.value.trim() || '未命名';
    b.entries = rows.map(function (r) {
      return { title: r.t.value.trim(), keys: r.k.value.split(/[,，、]/).map(function (s) { return s.trim(); }).filter(Boolean), content: r.c.value, enabled: r.en.checked };
    });
    return b;
  };
};
$('b-wb-save').onclick = async function () {
  if (!wbEditing || !wbEditing._collect) return;
  var b = wbEditing._collect(); delete b._collect;
  await dbPut('worldBooks', b); toast('已保存'); back();
};

/* ---------- 导入 / 导出 ---------- */
var IMPORT_STORES = ['characters', 'messages', 'memories', 'thoughts', 'worldBooks', 'worldBookCategories', 'userPersonas', 'stickers', 'stickerCategories'];
function startImport() { $('file-import').click(); }
$('file-import').addEventListener('change', async function () {
  var f = this.files[0]; this.value = ''; if (!f) return;
  var data;
  try { data = JSON.parse(await f.text()); } catch (e) { toast('文件不是有效的 JSON'); return; }
  if (data.format !== 'myphone-v1') { toast('不是 myphone-v1 格式的文件'); return; }
  var existing = (await dbAll('characters')).length;
  var withSettings = false;
  var doImport = async function () {
    toast('导入中，请稍候…');
    try {
      for (var i = 0; i < IMPORT_STORES.length; i++) await dbClear(IMPORT_STORES[i]);
      var lastByChar = {};
      (data.memories || []).forEach(function (m) { if (m.kind !== 'note') lastByChar[m.characterId] = Math.max(lastByChar[m.characterId] || 0, m.ts || 0); });
      var lastTh = {}; (data.thoughts || []).forEach(function (t) { lastTh[t.characterId] = Math.max(lastTh[t.characterId] || 0, t.ts || 0); });
      (data.characters || []).forEach(function (c) { c.lastSummaryTs = lastByChar[c.id] || 0; c.lastThoughtTs = lastTh[c.id] || 0; });
      for (var j = 0; j < IMPORT_STORES.length; j++) await dbBulkPut(IMPORT_STORES[j], data[IMPORT_STORES[j]] || []);
      if (withSettings && data.settings) { settings = Object.assign({}, DEFAULTS, data.settings); await saveSettings(); applyTheme(); }
      toast('导入完成：' + (data.characters || []).length + ' 个角色，' + (data.messages || []).length + ' 条消息');
      renderList();
    } catch (e) { toast('导入失败：' + e.message); }
  };
  var proceed = function () {
    if (existing) confirmSheet('导入会覆盖现有的角色、聊天、记忆和世界书。继续吗？', '覆盖导入', doImport, true);
    else doImport();
  };
  if (data.settings) {
    openSheet([h('h3', { text: '这个文件里带有设置' }), h('div', { class: 'hint', text: '包含 API Key 和配置预设。要一并导入（覆盖现在的设置）吗？' }),
      h('div', { class: 'btn-row' },
        h('button', { class: 'btn primary', text: '连设置一起导入', onclick: function () { withSettings = true; closeSheet(); proceed(); } }),
        h('button', { class: 'btn', text: '只导入数据', onclick: function () { closeSheet(); proceed(); } }),
        h('button', { class: 'btn', text: '取消', onclick: closeSheet }))]);
  } else proceed();
});
function exportData() {
  openSheet([h('h3', { text: '导出数据' }), h('div', { class: 'hint', text: '带上设置，换设备导入后不用重新填 API Key 和预设。带 Key 的文件请自己保管，不要发给别人。' }),
    h('div', { class: 'btn-row' },
      h('button', { class: 'btn primary', text: '导出（含 API Key 和预设）', onclick: function () { closeSheet(); doExport(true); } }),
      h('button', { class: 'btn', text: '只导出数据', onclick: function () { closeSheet(); doExport(false); } }),
      h('button', { class: 'btn', text: '取消', onclick: closeSheet }))]);
}
async function doExport(withSettings) {
  toast('正在导出…');
  var out = { format: 'myphone-v1', exportedAt: Date.now(), source: 'myphone' };
  for (var i = 0; i < IMPORT_STORES.length; i++) out[IMPORT_STORES[i]] = await dbAll(IMPORT_STORES[i]);
  out.characters.forEach(function (c) { delete c.lastSummaryTs; delete c.lastThoughtTs; });
  if (withSettings) out.settings = JSON.parse(JSON.stringify(settings));
  var blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'myphone-v1-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  toast('已导出 ' + (blob.size / 1048576).toFixed(1) + 'MB');
}

/* ---------- 启动 ---------- */
(async function () {
  try {
    await openDB(); await loadSettings(); applyTheme(); await renderHome();
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) { document.body.innerHTML = '<pre style="padding:20px;white-space:pre-wrap">启动失败：' + e.message + '</pre>'; }
})();
</script>
</body>
